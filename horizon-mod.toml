id = "laserio"
name = "LaserIO"
version = "0.2.0"
description = """A port of LaserIO for Horizon: a laser node keeps one item card per side, and an
extract card moves up to its amount out of the inventory on its side into the inventories its
network reaches — a node's insert card sides and a laser connector's facing side — once every 20
ticks, one item at a time at the shipped default. The node, the connector, the item card, their
models, textures, recipes and loot travel in this one package beside the code, so a single .hmod
installs both halves."""
authors = ["Direwolf20", "ErrorMikey", "AdLf0208"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside data/ and assets/. The id is the resource namespace and the only identity: Cargo's
# package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not the hook's: a laser node is placed and ticked by an
# integrated server, which belongs to the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod does add two blocks, four items and a block entity type, and the manifest's
# shape is not negotiable.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
